name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Dalamud Environment
        shell: pwsh
        run: |
          $dalamudPath = "$env:RUNNER_TEMP\Dalamud"
          New-Item -ItemType Directory -Force -Path $dalamudPath
          Write-Host "Downloading Dalamud runtime..."
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Write-Host "Extracting Dalamud runtime..."
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dalamudPath -Force
          Write-Host "Setting DALAMUD_HOME to $dalamudPath"
          "DALAMUD_HOME=$dalamudPath" >> $env:GITHUB_ENV

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $proj = Get-Content ARealmRecordedLite/ARealmRecordedLite.csproj | Out-String
          $version = [regex]::Match($proj, '<Version>(.*?)</Version>').Groups[1].Value
          if (-not $version) { $version = "1.0.6.1" }
          Write-Host "Detected version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Plugin
        run: dotnet build ARealmRecordedLite/ARealmRecordedLite.csproj -c Release

      - name: Package Plugin
        shell: pwsh
        run: |
          $outDir = "ARealmRecordedLite/bin/Release"
          $distDir = "dist"
          New-Item -ItemType Directory -Force -Path $distDir
          
          # Copy target files
          Copy-Item "$outDir/ARealmRecordedLite.dll" $distDir/
          Copy-Item "$outDir/ARealmRecordedLite.json" $distDir/
          if (Test-Path "$outDir/ARealmRecordedLite.pdb") {
            Copy-Item "$outDir/ARealmRecordedLite.pdb" $distDir/
          }

          # Create zip
          Compress-Archive -Path "$distDir/*" -DestinationPath "latest.zip" -Force
          Copy-Item "latest.zip" "ARealmRecordedLite.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            latest.zip
            ARealmRecordedLite.zip
            dist/ARealmRecordedLite.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
